backend:
  name: github
  repo: awiu-news/awiu-news-site
  branch: main
  base_url: SITE_URL_PLACEHOLDER
  auth_endpoint: api/auth
publish_mode: editorial_workflow
locale: ar
media_folder: img
public_folder: /img
collections:
  - name: news
    label: "الأخبار · News"
    label_singular: "خبر"
    folder: content
    extension: json
    format: json
    create: true
    editor:
      preview: false
    slug: "n-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{date_iso}} · {{title}}"
    fields:
      - {label: "عنوان الخبر", name: title, widget: string, hint: "اكتب العنوان هنا"}
      - {label: "صورة الخبر", name: image, widget: image, required: false, media_library: {config: {max_file_size: 4000000}}}
      - {label: "نص الخبر (تفاصيل الخبر)", name: body, widget: text, hint: "اكتب الخبر كاملا. لفصل الفقرات اترك سطرا فارغا بين كل فقرة والتي بعدها"}
      - {label: "الوسوم (الهاشتاجات)", name: hashtags, widget: string, required: false, hint: "مثال: #اتحاد_المستثمرات_العرب #د_هدى_يسى . اكتب كل وسم بعد مسافة، وبدل المسافة داخل الوسم اكتب _"}
      - {label: "التاريخ (يُكتب اليوم تلقائيا، لا تغيّره للأخبار القديمة)", name: date_iso, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
      - label: "القسم (اختياري، لو تركته فارغا يتحدد تلقائيا)"
        name: cat
        widget: select
        required: false
        options:
          - {label: "زيارات", value: visits}
          - {label: "ملتقيات", value: forums}
          - {label: "أخبار القمة", value: summit}
          - {label: "مشاركات دولية", value: intl}
          - {label: "اتفاقيات وبروتوكولات", value: agreements}
      - {label: "كود فيديو يوتيوب (اختياري)", name: video, widget: string, required: false}
      - {label: "العنوان بالإنجليزية (اختياري)", name: en_title, widget: string, required: false}
      - {label: "الخبر بالإنجليزية (اختياري، فقرة بينها سطر فارغ)", name: en_body, widget: text, required: false}
