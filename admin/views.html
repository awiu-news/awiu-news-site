<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>مشاهدات الأخبار</title>
<style>body{font:18px/1.7 Tahoma,Arial,sans-serif;margin:0;background:#0d1117;color:#e8ecf2}main{max-width:760px;margin:0 auto;padding:20px}h1{color:#d4a437;font-size:24px}a{color:#d4a437}table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid #2a3344;text-align:start}td.n{font-weight:bold;white-space:nowrap}.t{margin:10px 0;color:#9aa5b5}</style></head>
<body><main><h1>عدد مشاهدات الأخبار</h1><p><a href="/admin/">← لوحة التحرير</a></p><p class="t" id="t">جاري التحميل...</p><table id="tb"><tr><th>الخبر</th><th>المشاهدات</th></tr></table></main>
<script>Promise.all([fetch("/api/stats").then(function(r){return r.json()}),fetch("/articles.json").then(function(r){return r.json()})]).then(function(a){var m={};a[0].rows.forEach(function(r){m[r.id]=r.n});var tot=0,rows=Object.keys(a[1]).map(function(id){var n=m[id]||0;tot+=n;return [id,a[1][id],n]}).sort(function(x,y){return y[2]-x[2]});document.getElementById("t").textContent="إجمالي المشاهدات: "+tot.toLocaleString("ar-EG")+" · عدد الأخبار: "+rows.length;var tb=document.getElementById("tb");rows.forEach(function(r){var tr=document.createElement("tr"),a1=document.createElement("a");a1.href="/news/"+r[0]+"/";a1.textContent=r[1];var c1=document.createElement("td");c1.appendChild(a1);var c2=document.createElement("td");c2.className="n";c2.textContent=r[2].toLocaleString("ar-EG");tr.appendChild(c1);tr.appendChild(c2);tb.appendChild(tr)})}).catch(function(){document.getElementById("t").textContent="تعذر تحميل الأرقام الآن"})</script></body></html>
